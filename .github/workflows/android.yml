name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Godot project
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Validate project and parse all scripts
        shell: bash
        run: |
          set -euxo pipefail
          godot --version
          godot --headless --editor --path . --quit

  android:
    name: Export Android APK
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.7.2 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          grep -q 'name="Android"' export_presets.cfg
      - name: Export and validate APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --editor --path . --quit
          godot --headless --verbose --path . --export-debug "Android" build/FishingLegend.apk 2>&1 | tee build/export.log
          test -s build/FishingLegend.apk
          unzip -t build/FishingLegend.apk
          file build/FishingLegend.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FishingLegend-Android-APK
          path: build/FishingLegend.apk
          if-no-files-found: error
