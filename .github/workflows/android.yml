name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate Godot project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Check project and scripts
        shell: bash
        run: |
          set -euxo pipefail
          godot --version
          godot --headless --editor --path . --quit

  android:
    name: Export Android APK
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install Android SDK packages without setup-android action
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          else
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            find /usr/local/lib/android /opt -type f -name sdkmanager 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Android export preset
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/FishingLegend.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          package/unique_name="com.fishinglegend.mobile"
          package/name="Fishing Legend"
          package/signed=false
          package/app_category=0
          package/short_name="FishLegend"
          version/code=1
          version/name="1.0.0"
          architecture/armeabi-v7a=false
          architecture/arm64-v8a=true
          permissions/internet=false
          EOF

      - name: Export APK
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/FishingLegend.apk
          test -s build/FishingLegend.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FishingLegend-Android-APK
          path: build/FishingLegend.apk
          if-no-files-found: error
