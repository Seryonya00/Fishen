name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate Godot project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Check project and scripts
        shell: bash
        run: |
          set -euxo pipefail
          godot --version
          godot --headless --editor --path . --quit

  android:
    name: Export Android APK
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/FishingLegend.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          package/unique_name="com.fishinglegend.mobile"
          package/name="Fishing Legend"
          package/signed=false
          package/app_category=0
          package/short_name="FishLegend"
          version/code=1
          version/name="1.0.0"
          architecture/armeabi-v7a=false
          architecture/arm64-v8a=true
          permissions/internet=false
          EOF
          mkdir -p build

      - name: Export APK
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/FishingLegend.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FishingLegend-Android-APK
          path: build/FishingLegend.apk
          if-no-files-found: error
