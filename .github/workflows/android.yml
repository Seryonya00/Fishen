name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Prepare Android export preset
        shell: bash
        run: |
          mkdir -p build
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/FishingLegend.apk"
          patch ભૂ
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          package/unique_name="com.fishinglegend.mobile"
          package/name="Fishing Legend"
          package/signed=true
          package/app_category=0
          package/short_name="FishLegend"
          version/code=1
          version/name="1.0.0"
          architecture/armeabi-v7a=true
          architecture/arm64-v8a=true
          permissions/internet=false
          EOF

      - name: Validate project
        run: godot --headless --editor --path . --quit

      - name: Export APK
        run: godot --headless --path . --export-release "Android" build/FishingLegend.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FishingLegend-Android-APK
          path: build/FishingLegend.apk
          if-no-files-found: error
